name: Build OnlyUs Dual Android APKs

on:
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Release Tag Version (e.g. v1.0.0)'
        required: false
        default: 'v1.0.0'
        type: string

permissions:
  contents: write

jobs:
  build:
    name: Compile Nusrat & Rahul APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Node Dependencies
        run: npm install

      - name: Build Web Application
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Generate Custom Android Flavor Icons
        run: npm run icons

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Sync Capacitor Web Assets
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Build Dual Android APKs (Nusrat Stealth + Rahul Direct)
        run: |
          cd android
          ./gradlew assembleNusratDebug assembleRahulDebug --no-daemon --stacktrace

      - name: Organize APK Artifacts
        run: |
          cp android/app/build/outputs/apk/nusrat/debug/app-nusrat-debug.apk OnlyUs-Nusrat-Stealth.apk
          cp android/app/build/outputs/apk/rahul/debug/app-rahul-debug.apk OnlyUs-Rahul-Direct.apk

      - name: Upload Nusrat Stealth APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUs-Nusrat-Stealth-APK
          path: OnlyUs-Nusrat-Stealth.apk
          retention-days: 30

      - name: Upload Rahul Direct APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUs-Rahul-Direct-APK
          path: OnlyUs-Rahul-Direct.apk
          retention-days: 30

      - name: Publish Dual APKs to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ inputs.version_tag || 'v1.0.0' }}
          name: OnlyUs Android Companion (${{ inputs.version_tag || 'v1.0.0' }})
          draft: false
          prerelease: false
          body: |
            ### 💖 OnlyUs Android Dual Edition Companion Apps

            Download the edition that fits your device:

            - 📓 **`OnlyUs-Nusrat-Stealth.apk`** *(Nusrat Edition)*:
              - Disguised on the home screen as **"Notes"** with a clean notepad interface.
              - **Secret Unlock**: Type **`#6969#`** into the notepad search bar to reveal OnlyUs!
              - **Panic Exit**: Shake phone to immediately exit and close the app.
              - **Recent-Apps Protection**: Protected with `FLAG_SECURE` so recent-apps drawer shows blank.
              - **Auto-Lock**: Returns to Notes when screen turns off or app is minimized.

            - 💬 **`OnlyUs-Rahul-Direct.apk`** *(Rahul Edition)*:
              - Appears on the home screen as **"OnlyUs"**.
              - Direct entry into the full chat with notifications, instant real-time sync, voice notes, and games.
          files: |
            OnlyUs-Nusrat-Stealth.apk
            OnlyUs-Rahul-Direct.apk

      - name: Workflow Summary
        run: |
          echo "### OnlyUs Dual Android APKs Built Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Both APKs have been uploaded to **Artifacts** and published to the **GitHub Releases** tab." >> $GITHUB_STEP_SUMMARY
          echo "- **Nusrat Edition**: OnlyUs-Nusrat-Stealth.apk (Disguised Notepad + #6969# trigger + Shake panic)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rahul Edition**: OnlyUs-Rahul-Direct.apk (Full direct chat + Notifications)" >> $GITHUB_STEP_SUMMARY
