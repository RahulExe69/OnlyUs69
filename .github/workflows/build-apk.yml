name: Build OnlyUs Dual Android APKs

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release = Signed Production, debug = Development)'
        required: false
        default: 'release'
        type: choice
        options:
          - release
          - debug
      version_name:
        description: 'APK Version Name (e.g. 1.5.2)'
        required: false
        default: '1.5.2'
        type: string
      version_code:
        description: 'Android versionCode (integer; leave blank to calculate from MAJOR.MINOR.PATCH)'
        required: false
        default: ''
        type: string
      version_tag:
        description: 'GitHub Release Tag (e.g. v1.5.2, leave empty to auto-use v<version_name>)'
        required: false
        default: ''
        type: string
      publish_release:
        description: 'Publish signed APKs and update metadata to the public OnlyUs69-Releases repository'
        required: false
        default: true
        type: boolean
      whats_new:
        description: "Customer-facing What's new notes shown in the app (separate items with |; required when publishing)"
        required: false
        default: ''
        type: string

  pull_request:
    paths:
      - '.github/workflows/build-apk.yml'
      - 'android/**'
      - 'src/**'
      - 'scripts/**'
      - 'package.json'
      - 'index.html'
      - 'vite.config.*'

permissions:
  contents: write

jobs:
  build:
    name: Compile Nusrat & Rahul APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Resolve Versioning Parameters
        id: vars
        run: |
          BUILD_TYPE="${{ inputs.build_type }}"
          if [ -z "$BUILD_TYPE" ]; then
            BUILD_TYPE="release"
          fi
          if [ "$BUILD_TYPE" = "release" ]; then
            GRADLE_TASK_SUFFIX="Release"
          else
            GRADLE_TASK_SUFFIX="Debug"
          fi

          RAW_NAME="${{ inputs.version_name }}"
          if [ -z "$RAW_NAME" ]; then
            RAW_NAME="1.5.2"
          fi
          CLEAN_NAME="${RAW_NAME#v}"

          RAW_CODE="${{ inputs.version_code }}"
          if [ -z "$RAW_CODE" ]; then
            if [[ ! "$CLEAN_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::Version name must use MAJOR.MINOR.PATCH format (for example 1.5.0)."
              exit 1
            fi
            IFS="." read -r MAJOR MINOR PATCH <<< "$CLEAN_NAME"
            if (( MINOR >= 1000 || PATCH >= 1000 )); then
              echo "::error::Minor and patch version numbers must each be below 1000."
              exit 1
            fi
            RAW_CODE=$((MAJOR * 1000000 + MINOR * 1000 + PATCH))
          fi
          if [[ ! "$RAW_CODE" =~ ^[0-9]+$ ]] || (( RAW_CODE <= 0 || RAW_CODE > 2100000000 )); then
            echo "::error::Version code must be a positive integer no greater than 2100000000."
            exit 1
          fi

          RAW_TAG="${{ inputs.version_tag }}"
          if [ -z "$RAW_TAG" ]; then
            RAW_TAG="v${CLEAN_NAME}"
          fi

          echo "build_type=${BUILD_TYPE}" >> $GITHUB_OUTPUT
          echo "gradle_task_suffix=${GRADLE_TASK_SUFFIX}" >> $GITHUB_OUTPUT
          echo "version_name=${CLEAN_NAME}" >> $GITHUB_OUTPUT
          echo "version_code=${RAW_CODE}" >> $GITHUB_OUTPUT
          echo "version_tag=${RAW_TAG}" >> $GITHUB_OUTPUT
          echo "✅ Building [${BUILD_TYPE}] with versionName=${CLEAN_NAME}, versionCode=${RAW_CODE}, releaseTag=${RAW_TAG}"

      - name: Initialize Log Environment
        id: step_init_logs
        run: mkdir -p logs

      - name: Setup Node.js 22
        id: step_setup_node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Cache npm downloads
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: npm-${{ runner.os }}-${{ hashFiles('package.json') }}
          restore-keys: |
            npm-${{ runner.os }}-

      - name: Install Node Dependencies
        id: step_install_deps
        run: |
          set -o pipefail
          npm install --no-audit --no-fund 2>&1 | tee logs/step_install_deps.log

      - name: Build Web Application
        id: step_build_web
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          set -o pipefail
          npm run build 2>&1 | tee logs/step_build_web.log

      - name: Generate Custom Android Flavor Icons
        id: step_icons
        run: |
          set -o pipefail
          npm run icons 2>&1 | tee logs/step_icons.log

      - name: Set up Java JDK 21
        id: step_setup_java
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Gradle Cache
        id: step_setup_gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure Android SDK & Licenses
        id: step_setup_android
        run: |
          set -o pipefail
          {
            echo "Configuring runner Android SDK..."
            export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
            export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"
            echo "ANDROID_HOME=$ANDROID_HOME"
            # Avoid remote sdkmanager scans on runners that already have the required SDK.
            NEED_INSTALL=()
            [ -d "$ANDROID_HOME/platforms/android-36" ] || NEED_INSTALL+=("platforms;android-36")
            [ -d "$ANDROID_HOME/build-tools/36.0.0" ] || NEED_INSTALL+=("build-tools;36.0.0")
            if [ "${#NEED_INSTALL[@]}" -gt 0 ]; then
              echo "Accepting licenses and installing only missing Android SDK packages: ${NEED_INSTALL[*]}"
              yes | sdkmanager --licenses || true
              sdkmanager "${NEED_INSTALL[@]}"
            else
              echo "Required Android SDK packages are already installed; skipping sdkmanager and license scans."
            fi
            echo "Android SDK configuration completed."
          } 2>&1 | tee logs/step_setup_android.log

      - name: Sync Capacitor Web Assets
        id: step_cap_sync
        run: |
          set -o pipefail
          npx cap sync android 2>&1 | tee logs/step_cap_sync.log

      - name: Make Gradle Wrapper Executable
        id: step_chmod_gradlew
        run: |
          chmod +x ./android/gradlew 2>&1 | tee logs/step_chmod_gradlew.log

      - name: Build Dual Android APKs (Nusrat Stealth + Rahul Direct)
        id: step_build_apks
        env:
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD || 'onlyuspassword' }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS || 'onlyus' }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD || 'onlyuspassword' }}
        run: |
          set -o pipefail
          cd android
          TASK_SUFFIX="${{ steps.vars.outputs.gradle_task_suffix }}"
          echo "Executing Gradle tasks: assembleNusrat${TASK_SUFFIX} assembleRahul${TASK_SUFFIX}"
          ./gradlew "assembleNusrat${TASK_SUFFIX}" "assembleRahul${TASK_SUFFIX}" \
            -PversionCode=${{ steps.vars.outputs.version_code }} \
            -PversionName=${{ steps.vars.outputs.version_name }} \
            --no-daemon --build-cache --parallel --stacktrace 2>&1 | tee ../logs/step_build_apks.log

      - name: Organize APK Artifacts
        id: step_organize_apks
        run: |
          set -o pipefail
          {
            VER="${{ steps.vars.outputs.version_name }}"
            BTYPE="${{ steps.vars.outputs.build_type }}"
            
            NUSRAT_APK=$(find "android/app/build/outputs/apk/nusrat/${BTYPE}" -name "*.apk" 2>/dev/null | head -n 1)
            if [ -z "$NUSRAT_APK" ]; then
              NUSRAT_APK=$(find android/app/build/outputs/apk/nusrat -name "*.apk" | head -n 1)
            fi
            
            RAHUL_APK=$(find "android/app/build/outputs/apk/rahul/${BTYPE}" -name "*.apk" 2>/dev/null | head -n 1)
            if [ -z "$RAHUL_APK" ]; then
              RAHUL_APK=$(find android/app/build/outputs/apk/rahul -name "*.apk" | head -n 1)
            fi
            
            echo "Selected Nusrat APK (${BTYPE}): $NUSRAT_APK"
            echo "Selected Rahul APK (${BTYPE}): $RAHUL_APK"
            if [ -n "$NUSRAT_APK" ] && [ -f "$NUSRAT_APK" ]; then
              cp "$NUSRAT_APK" Notes.apk
              cp "$NUSRAT_APK" "Notes-v${VER}.apk"
              cp "$NUSRAT_APK" OnlyUs-Nusrat-Stealth.apk
              cp "$NUSRAT_APK" "OnlyUs-Nusrat-Stealth-v${VER}.apk"
            else
              echo "::error::Nusrat APK not found"
              exit 1
            fi
            if [ -n "$RAHUL_APK" ] && [ -f "$RAHUL_APK" ]; then
              cp "$RAHUL_APK" OnlyUs.apk
              cp "$RAHUL_APK" "OnlyUs-v${VER}.apk"
              cp "$RAHUL_APK" OnlyUs-Rahul-Direct.apk
              cp "$RAHUL_APK" "OnlyUs-Rahul-Direct-v${VER}.apk"
            else
              echo "::error::Rahul APK not found"
              exit 1
            fi
          } 2>&1 | tee logs/step_organize_apks.log

      - name: Upload Nusrat Stealth APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUs-Nusrat-Stealth-APK
          path: |
            Notes.apk
            Notes-v${{ steps.vars.outputs.version_name }}.apk
            OnlyUs-Nusrat-Stealth.apk
            OnlyUs-Nusrat-Stealth-v${{ steps.vars.outputs.version_name }}.apk
          retention-days: 30

      - name: Upload Rahul Direct APK to Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUs-Rahul-Direct-APK
          path: |
            OnlyUs.apk
            OnlyUs-v${{ steps.vars.outputs.version_name }}.apk
            OnlyUs-Rahul-Direct.apk
            OnlyUs-Rahul-Direct-v${{ steps.vars.outputs.version_name }}.apk
          retention-days: 30

      - name: Checkout public release repository
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.vars.outputs.build_type == 'release'
        uses: actions/checkout@v4
        with:
          repository: RahulExe69/OnlyUs69-Releases
          ref: main
          path: release-repo
          token: ${{ secrets.ONLYUS_RELEASE_TOKEN }}

      - name: Generate Play Store-style release notes
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.vars.outputs.build_type == 'release'
        env:
          RELEASE_REPO_PATH: release-repo
          RELEASE_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          RELEASE_VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
        run: node scripts/generate-release-notes.mjs

      - name: Validate public release configuration
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.vars.outputs.build_type == 'release'
        env:
          ONLYUS_RELEASE_TOKEN: ${{ secrets.ONLYUS_RELEASE_TOKEN }}
        run: |
          if [ -z "$ONLYUS_RELEASE_TOKEN" ]; then
            echo "::error::Missing ONLYUS_RELEASE_TOKEN. Add a fine-grained PAT in OnlyUs69 repository secrets with Contents: Read and write access only to RahulExe69/OnlyUs69-Releases."
            exit 1
          fi

      - name: Publish signed APKs to public release repository
        if: github.event_name == 'workflow_dispatch' && inputs.publish_release == true && steps.vars.outputs.build_type == 'release'
        uses: softprops/action-gh-release@v2
        with:
          repository: RahulExe69/OnlyUs69-Releases
          token: ${{ secrets.ONLYUS_RELEASE_TOKEN }}
          tag_name: ${{ steps.vars.outputs.version_tag }}
          name: OnlyUs Android Release (${{ steps.vars.outputs.version_tag }})
          draft: false
          prerelease: false
          make_latest: true
          overwrite_files: true
          fail_on_unmatched_files: true
          body_path: release-notes.md
          files: |
            OnlyUs.apk
            Notes.apk
            OnlyUs-v${{ steps.vars.outputs.version_name }}.apk
            Notes-v${{ steps.vars.outputs.version_name }}.apk

      - name: Publish customer-facing update metadata
        if: inputs.publish_release == true && steps.vars.outputs.build_type == 'release'
        env:
          RELEASE_VERSION_NAME: ${{ steps.vars.outputs.version_name }}
          RELEASE_VERSION_CODE: ${{ steps.vars.outputs.version_code }}
          RELEASE_VERSION_TAG: ${{ steps.vars.outputs.version_tag }}
          RELEASE_REPO: RahulExe69/OnlyUs69-Releases
          RELEASE_REPO_PATH: release-repo
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/generate-release-metadata.mjs
          git -C "$RELEASE_REPO_PATH" config user.name "github-actions[bot]"
          git -C "$RELEASE_REPO_PATH" config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git -C "$RELEASE_REPO_PATH" add latest.json
          if ! git -C "$RELEASE_REPO_PATH" diff --cached --quiet; then
            git -C "$RELEASE_REPO_PATH" commit -m "Publish update metadata for ${RELEASE_VERSION_TAG}"
            git -C "$RELEASE_REPO_PATH" push origin HEAD:main
          else
            echo "Update metadata is already current."
          fi

      - name: Workflow Summary (Success)
        if: success()
        run: |
          echo "### OnlyUs Dual Android APKs Built Successfully! 🚀" >> $GITHUB_STEP_SUMMARY
          echo "Version: **${{ steps.vars.outputs.version_name }}** (Build code: **${{ steps.vars.outputs.version_code }}**)" >> $GITHUB_STEP_SUMMARY
          echo "Build Type: **${{ steps.vars.outputs.build_type }}** (Signed with keystore)" >> $GITHUB_STEP_SUMMARY
          echo "Release Tag: **${{ steps.vars.outputs.version_tag }}**" >> $GITHUB_STEP_SUMMARY
          echo "Both APK variants are available as workflow artifacts. Public release publishing only runs when Publish release is enabled for a signed release build." >> $GITHUB_STEP_SUMMARY
          echo "- **Nusrat Edition**: OnlyUs-Nusrat-Stealth.apk (Disguised Notepad + #6969# trigger + Shake panic)" >> $GITHUB_STEP_SUMMARY
          echo "- **Rahul Edition**: OnlyUs-Rahul-Direct.apk (Full direct chat + Inline Notifications)" >> $GITHUB_STEP_SUMMARY

      - name: Diagnose Build Failure & Generate Fix Report
        if: failure()
        env:
          STEPS_CONTEXT: ${{ toJSON(steps) }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          node .github/scripts/diagnose-build-failure.js

      - name: Upload Build Failure Diagnostic Log Artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: OnlyUs-Build-Failure-Diagnostic-Log
          path: |
            OnlyUs-Build-Failure-Diagnostic.md
            OnlyUs-Build-Failure-Diagnostic.txt
            logs/
          retention-days: 14
